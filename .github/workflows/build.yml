name: build
on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: {go-version: '1.25.x', cache: true}
      - uses: actions/setup-node@v7
        with: {node-version: '24', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci && npm run check && npm run build
        working-directory: frontend
      - run: go test -race ./...

  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            platform: windows/amd64
            artifact: windows-x64
          - os: macos-15-intel
            platform: darwin/amd64
            artifact: macos-x64
          - os: macos-15
            platform: darwin/arm64
            artifact: macos-arm64
          - os: ubuntu-24.04
            platform: linux/amd64
            artifact: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: {go-version: '1.25.x', cache: true}
      - uses: actions/setup-node@v7
        with: {node-version: '24', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential libgtk-3-dev libwebkit2gtk-4.1-dev
      - run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0
      - if: runner.os == 'macOS'
        run: wails build -clean -platform ${{ matrix.platform }} -compiler ./scripts/go-wails-macos.sh
      - if: runner.os == 'Linux'
        run: wails build -clean -platform ${{ matrix.platform }} -tags webkit2_41
      - if: runner.os == 'Windows'
        run: wails build -clean -platform ${{ matrix.platform }} -webview2 download
      - name: Package macOS build
        if: runner.os == 'macOS'
        run: |
          ./scripts/create-macos-dmg.sh \
            "build/bin/Camunda Stub Worker.app" \
            "build/bin/Camunda Stub Worker-${{ matrix.artifact }}.dmg"
      - uses: actions/upload-artifact@v7
        with:
          name: Camunda Stub Worker-${{ matrix.artifact }}
          path: build/bin/**
