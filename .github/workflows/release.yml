name: release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create (for example, v1.1.0)
        required: true
        type: string
      prerelease:
        description: Mark the release as a prerelease
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      safe_tag: ${{ steps.release.outputs.safe_tag }}
      publish_after_upload: ${{ steps.release.outputs.publish_after_upload }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          REQUESTED_TAG: ${{ inputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ "$EVENT_NAME" == "release" ]]; then
            tag="$RELEASE_TAG"
            publish_after_upload=false
          else
            tag="$REQUESTED_TAG"
            git check-ref-format "refs/tags/$tag"

            if release_is_draft=$(gh release view "$tag" --json isDraft --jq '.isDraft' 2>/dev/null); then
              publish_after_upload="$release_is_draft"
              echo "Reusing the existing release for $tag."
            else
              create_args=("$tag" --target "$DEFAULT_BRANCH" --generate-notes --notes-file .github/release-notes.md --draft)
              if [[ "$PRERELEASE" == "true" ]]; then
                create_args+=(--prerelease)
              fi
              gh release create "${create_args[@]}"
              publish_after_upload=true
            fi
          fi

          safe_tag=$(printf '%s' "$tag" | sed 's/[^A-Za-z0-9._-]/-/g')
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "safe_tag=$safe_tag" >> "$GITHUB_OUTPUT"
          echo "publish_after_upload=$publish_after_upload" >> "$GITHUB_OUTPUT"

  test:
    name: Test release source
    needs: prepare
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: actions/setup-go@v7
        with: {go-version: '1.25.x', cache: true}
      - uses: actions/setup-node@v7
        with: {node-version: '24', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci && npm run check && npm run build
        working-directory: frontend
      - run: go test -race ./...

  build:
    name: Build ${{ matrix.artifact }}
    needs: [prepare, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            platform: windows/amd64
            artifact: windows-x64
          - os: macos-15-intel
            platform: darwin/amd64
            artifact: macos-x64
          - os: macos-15
            platform: darwin/arm64
            artifact: macos-arm64
          - os: ubuntu-24.04
            platform: linux/amd64
            artifact: linux-x64
    runs-on: ${{ matrix.os }}
    env:
      APP_VERSION: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: actions/setup-go@v7
        with: {go-version: '1.25.x', cache: true}
      - uses: actions/setup-node@v7
        with: {node-version: '24', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential libgtk-3-dev libwebkit2gtk-4.1-dev
      - run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0
      - if: runner.os == 'macOS'
        run: wails build -clean -platform ${{ matrix.platform }} -compiler ./scripts/go-wails-macos.sh -ldflags "-X main.version=${APP_VERSION#v}"
      - if: runner.os == 'Linux'
        run: wails build -clean -platform ${{ matrix.platform }} -tags webkit2_41 -ldflags "-X main.version=${APP_VERSION#v}"
      - if: runner.os == 'Windows'
        shell: pwsh
        run: wails build -clean -platform ${{ matrix.platform }} -webview2 download -ldflags "-X main.version=$($env:APP_VERSION -replace '^v','')"

      - name: Package macOS build
        if: runner.os == 'macOS'
        env:
          ASSET_NAME: Camunda Stub Worker-${{ needs.prepare.outputs.safe_tag }}-${{ matrix.artifact }}.dmg
        run: |
          mkdir -p dist
          ./scripts/create-macos-dmg.sh \
            "build/bin/Camunda Stub Worker.app" \
            "dist/$ASSET_NAME"

      - name: Package Linux build
        if: runner.os == 'Linux'
        env:
          ASSET_NAME: Camunda Stub Worker-${{ needs.prepare.outputs.safe_tag }}-${{ matrix.artifact }}.tar.gz
        run: |
          mkdir -p dist
          tar -C build/bin -czf "dist/$ASSET_NAME" "Camunda Stub Worker"

      - name: Package Windows build
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          ASSET_NAME: Camunda Stub Worker-${{ needs.prepare.outputs.safe_tag }}-${{ matrix.artifact }}.zip
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path build/bin/* -DestinationPath "dist/$env:ASSET_NAME"

      - uses: actions/upload-artifact@v7
        with:
          name: release-asset-${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Upload release assets
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: release-asset-*
          path: release-assets
          merge-multiple: true

      - name: Create checksums
        working-directory: release-assets
        run: sha256sum * > checksums.txt

      - name: Upload assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release upload "$TAG" release-assets/* --clobber --repo "$GITHUB_REPOSITORY"

      - name: Publish manually created release
        if: github.event_name == 'workflow_dispatch' && needs.prepare.outputs.publish_after_upload == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release edit "$TAG" --draft=false --repo "$GITHUB_REPOSITORY"
